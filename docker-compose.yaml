volumes:
  pgdata: # audit data survives container recreation

services:
  toy-mcp-server:
    build: ./toy-server
    container_name: toy-mcp-server
    ports:
      - "8080:8080"

  # Relationship graph (Phase 6). Answers "does alice OWN record 2?" —
  # per-record ownership, a question role-based rules can't express.
  # agentgate writes the schema and seed relationships at startup.
  spicedb:
    image: authzed/spicedb:latest
    container_name: spicedb
    command: ["serve", "--grpc-preshared-key", "agentgate-dev-key"]
    ports:
      - "50051:50051" # gRPC API (zed CLI / agentgate)

  # Audit database. Every authorization decision is written here; the
  # schema in migrations/ runs automatically on first start.
  postgres:
    image: postgres:17-alpine
    container_name: agentgate-postgres
    environment:
      POSTGRES_USER: agentgate
      POSTGRES_PASSWORD: agentgate
      POSTGRES_DB: agentgate
    volumes:
      - ./migrations:/docker-entrypoint-initdb.d:ro
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentgate"]
      interval: 3s
      timeout: 3s
      retries: 15

  # Identity provider. Issues the JWTs that say which agent is acting on
  # behalf of which human. The realm (users, roles, claim mappers) is
  # imported from keycloak/realm-agentgate.json on first start.
  keycloak:
    image: quay.io/keycloak/keycloak:26.3
    container_name: keycloak
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      # Tokens must carry the same issuer whether requested from the host
      # (localhost:8081) or verified inside the docker network.
      KC_HOSTNAME: http://localhost:8081
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
    volumes:
      - ./keycloak:/opt/keycloak/data/import:ro
    ports:
      - "8081:8080" # admin console + token endpoint on the host

  # The governance service — agentgateway consults it (via the gRPC
  # ext_authz protocol) before forwarding any request to a backend.
  agentgate:
    build: ./agentgate
    container_name: agentgate
    environment:
      POLICY_FILE: /policies/agentgate.cedar
      DATABASE_URL: postgres://agentgate:agentgate@postgres:5432/agentgate
      TOY_MCP_URL: http://toy-mcp-server:8080/mcp
      # Slack is optional — set these in a .env file to enable real Slack
      # approval messages; the local approval UI on :8090 always works.
      SLACK_BOT_TOKEN: ${SLACK_BOT_TOKEN:-}
      SLACK_CHANNEL: ${SLACK_CHANNEL:-}
      SLACK_SIGNING_SECRET: ${SLACK_SIGNING_SECRET:-}
      SPICEDB_ENDPOINT: spicedb:50051
      SPICEDB_TOKEN: agentgate-dev-key
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      # Policies are mounted, not baked into the image — editing the .cedar
      # file and restarting the container is the whole "deploy" story.
      - ./policies:/policies:ro
    ports:
      - "9000:9000" # ext_authz gRPC (for the gateway)
      - "8090:8090" # approval UI + Slack callback

  agentgateway:
    image: ghcr.io/agentgateway/agentgateway:latest
    container_name: agentgateway
    command: ["-f", "/etc/agentgateway/config.yaml"]
    volumes:
      - ./gateway/config.yaml:/etc/agentgateway/config.yaml:ro
    ports:
      - "3000:3000"   # MCP listener
      - "15000:15000" # Admin UI
    depends_on:
      - toy-mcp-server
      - agentgate
