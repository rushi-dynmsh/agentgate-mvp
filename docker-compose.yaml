services:
  toy-mcp-server:
    build: ./toy-server
    container_name: toy-mcp-server
    ports:
      - "8080:8080"

  # The governance service — agentgateway consults it (via the gRPC
  # ext_authz protocol) before forwarding any request to a backend.
  agentgate:
    build: ./agentgate
    container_name: agentgate
    ports:
      - "9000:9000"

  agentgateway:
    image: ghcr.io/agentgateway/agentgateway:latest
    container_name: agentgateway
    command: ["-f", "/etc/agentgateway/config.yaml"]
    volumes:
      - ./gateway/config.yaml:/etc/agentgateway/config.yaml:ro
    ports:
      - "3000:3000"   # MCP listener
      - "15000:15000" # Admin UI
    depends_on:
      - toy-mcp-server
      - agentgate
